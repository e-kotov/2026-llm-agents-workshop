project:
  type: website
  brand: _brand.yml

website:
  title: "Beyond the Chatbox"
  description: "Beyond the Chatbox: LLM Coding and Research Agents for Academics"
  repo-url: https://github.com/e-kotov/2026-llm-agents-workshop
  repo-actions: [edit, issue]
  open-graph:
    title: "Beyond the Chatbox"
    description: "LLM Coding and Research Agents for Academics"
    image: media/workshop-ad.png
  
  navbar:
    background: "#0A7878" # Explicitly use the dark green hex to override theme defaults
    search: false
    right:
      - icon: github
        href: https://github.com/e-kotov/2026-llm-agents-workshop
        aria-label: GitHub
  
  sidebar:
    id: "main"
    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - section: "Workshop"
        contents:
          - index.qmd
          - auto: "[0-9][0-9]-*.qmd"
      - section: "Resources"
        contents:
          - text: "Workshop Workspace"
            href: "https://github.com/e-kotov/2026-llm-agents-workshop/tree/main/workspace"

  page-footer:
    border: true
    left: "© 2026 Egor Kotov"
    center:
      - text: "CC-BY-SA 4.0"
        href: https://creativecommons.org/licenses/by-sa/4.0/
    right: 
      - icon: github
        href: https://github.com/e-kotov/2026-llm-agents-workshop

  page-navigation: true
  reader-mode: true

  search:
    location: sidebar
    type: textbox

format:
  html:
    lightbox:
      match: auto
      effect: fade
      desc-position: top
    callout-appearance: simple
    theme:
      light: [cosmo, styles.css]
      dark: [cosmo, styles.css]
    mainfont: "Roboto, Arial, Helvetica, sans-serif"
    page-layout: article
    toc: true
    toc-location: right
    toc-title: "On this page"
    number-sections: false
    code-fold: show
    code-summary: "Show the code"
    code-tools: false
    code-link: true
    code-copy: true
    back-to-top: true
    title-block-banner: false
    link-external-icon: true
    link-external-newwindow: true
    # link-external-filter: 'ekotov\.pro'
    code-overflow: wrap
    mermaid:
      theme: neutral
    include-in-header:
      - text: |
          <meta name="DC.Type" content="WebPage">
      - file: media/analytics.html

execute:
  freeze: true

citation:
  type: webpage
  title: "Beyond the Chatbox: LLM Coding and Research Agents for Academics"
  url: https://github.com/e-kotov/2026-llm-agents-workshop
google-scholar: true

authors:
  - name: Egor Kotov
    url: https://www.ekotov.pro/
    orcid: 0000-0001-6690-5345
    affiliations:
      - ref: mpidr
      - ref: upf

affiliations:
  - id: mpidr
    name: Max Planck Institute for Demographic Research
    city: Rostock
    country: Germany
    url: https://www.demogr.mpg.de/en
  - id: upf
    name: Universitat Pompeu Fabra
    city: Barcelona
    country: Spain
    url: https://www.upf.edu/en/web/politiques/home
