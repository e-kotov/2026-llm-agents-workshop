project:
  type: book
  brand: _brand.yml
  post-render:
    - scripts/copy-pdf.sh


number-sections: true
number-depth: 3

csl: apa.csl



book:
  title: "Beyond the Chatbox"
  description: "Beyond the Chatbox: LLM Coding and Research Agents for Academics"
  repo-url: https://github.com/e-kotov/2026-llm-agents-workshop
  repo-actions: [edit, issue]
  open-graph:
    title: "Beyond the Chatbox"
    description: "LLM Coding and Research Agents for Academics"
    image: media/workshop-ad.png
  
  navbar:
    background: "#0A7878"
    search: false
    # right:
    #   - icon: file-earmark-pdf
    #     text: "Download PDF"
    #     href: assets/Beyond-the-Chatbox.pdf
    #     target: _blank
  
  sidebar:
    id: "main"
    style: "docked"
    search: true
    collapse-level: 2

  chapters:
    - index.qmd
    - 10-intro-to-agents.qmd
    - 20-security-sandboxing.qmd
    - 30-setup.qmd
    - 40-workspace.qmd
    - 50-agent-interactions.qmd
    - 90-references.qmd

  page-footer:
    border: true
    left: "© 2026 Egor Kotov"
    center:
      - text: "CC-BY-SA 4.0"
        href: https://creativecommons.org/licenses/by-sa/4.0/
        target: _blank
    right: 
      - icon: github
        href: https://github.com/e-kotov/2026-llm-agents-workshop
        target: _blank

  page-navigation: true
  reader-mode: true

  search:
    location: sidebar
    type: textbox

format:
  html:
    lightbox:
      match: auto
      effect: fade
      desc-position: top
    callout-appearance: simple
    theme:
      light: [cosmo, styles.css]
      dark: [cosmo, styles.css]
    mainfont: "Roboto, Arial, Helvetica, sans-serif"
    page-layout: article
    toc: true
    toc-location: right
    toc-title: "On this page"
    number-sections: true
    grid:
      body-width: 950px
      margin-width: 300px
      sidebar-width: 300px
    code-fold: show
    code-summary: "Show the code"
    code-tools: false
    code-link: true
    code-copy: true
    back-to-top: true
    title-block-banner: false
    link-external-icon: true
    link-external-newwindow: true
    code-overflow: wrap
    mermaid:
      theme: neutral
    include-in-header:
      - text: |
          <meta name="DC.Type" content="WebPage">
          <script src="scripts/details-fold.js" defer></script>
          <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
          <script src="scripts/typed-init.js" defer></script>
      - file: scripts/analytics.html
  typst:
    filters:
      - scripts/trigger-fix.lua

execute:
  freeze: true

citation:
  type: webpage
  title: "Beyond the Chatbox: LLM Coding and Research Agents for Academics"
  url: https://github.com/e-kotov/2026-llm-agents-workshop
  issued: 2026
google-scholar: true

authors:
  - name: Egor Kotov
    url: https://www.ekotov.pro/
    orcid: 0000-0001-6690-5345
    affiliations:
      - ref: mpidr
      - ref: upf

affiliations:
  - id: mpidr
    name: Max Planck Institute for Demographic Research
    city: Rostock
    country: Germany
    url: https://www.demogr.mpg.de/en
  - id: upf
    name: Universitat Pompeu Fabra
    city: Barcelona
    country: Spain
    url: https://www.upf.edu/en/web/politiques/home
